<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8edf3;
            font-family: Arial, sans-serif;
        }

        .calculadora {
            width: 320px;
            padding: 22px;
            border-radius: 25px;
            background: #20242c;
            box-shadow: 0 15px 35px #0004;
        }

        h2 {
            color: white;
            text-align: center;
            margin-top: 0;
        }

        #visor {
            width: 100%;
            height: 75px;
            margin-bottom: 18px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #dcebd8;
            color: #18251b;
            font-size: 32px;
            text-align: right;
        }

        .teclado {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 12px;
            background: #3b414c;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.2);
        }

        .operador {
            background: #3d05c0;
        }

        .especial {
            background: #7e0101;
        }

        .igual {
            background: #e1ff75;
        }

        .zero {
            grid-column: span 2;
        }

        .areas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .areas button {
            height: 45px;
            font-size: 13px;
            background: #515c70;
        }
    </style>
</head>

<body>

<div class="calculadora">

    <h2>Calculadora</h2>

    <input type="text" id="visor" value="0" readonly>

    <div class="teclado">
        <button class="especial" onclick="limpar()">AC</button>
        <button class="especial" onclick="apagar()">⌫</button>
        <button class="operador" onclick="escolherOperacao('/')">÷</button>
        <button class="operador" onclick="escolherOperacao('*')">×</button>

        <button onclick="inserir('7')">7</button>
        <button onclick="inserir('8')">8</button>
        <button onclick="inserir('9')">9</button>
        <button class="operador" onclick="escolherOperacao('-')">−</button>

        <button onclick="inserir('4')">4</button>
        <button onclick="inserir('5')">5</button>
        <button onclick="inserir('6')">6</button>
        <button class="operador" onclick="escolherOperacao('+')">+</button>

        <button onclick="inserir('1')">1</button>
        <button onclick="inserir('2')">2</button>
        <button onclick="inserir('3')">3</button>
        <button class="igual" onclick="calcular()">=</button>

        <button class="zero" onclick="inserir('0')">0</button>
        <button onclick="decimal()">.</button>
        <button class="especial" onclick="limpar()">C</button>
    </div>

    <div class="areas">
        <button onclick="areaQuadrado()">Área do quadrado</button>
        <button onclick="areaTriangulo()">Área do triângulo</button>
    </div>

</div>

<script>
    const visor = document.getElementById("visor");

    let primeiroNumero = null;
    let operacao = null;
    let novoNumero = true;

    function inserir(numero) {
        if (novoNumero || visor.value === "0") {
            visor.value = numero;
            novoNumero = false;
        } else {
            visor.value += numero;
        }
    }

    function decimal() {
        if (novoNumero) {
            visor.value = "0.";
            novoNumero = false;
        } else if (!visor.value.includes(".")) {
            visor.value += ".";
        }
    }

    function escolherOperacao(op) {
        primeiroNumero = Number(visor.value);
        operacao = op;
        novoNumero = true;
    }

    function calcular() {
        if (operacao === null) return;

        const segundoNumero = Number(visor.value);
        let resultado;

        switch (operacao) {
            case "+":
                resultado = primeiroNumero + segundoNumero;
                break;
            case "-":
                resultado = primeiroNumero - segundoNumero;
                break;
            case "*":
                resultado = primeiroNumero * segundoNumero;
                break;
            case "/":
                if (segundoNumero === 0) {
                    visor.value = "Erro";
                    operacao = null;
                    novoNumero = true;
                    return;
                }
                resultado = primeiroNumero / segundoNumero;
                break;
        }

        visor.value = String(
            Number(resultado.toPrecision(10))
        );

        operacao = null;
        primeiroNumero = null;
        novoNumero = true;
    }

    function limpar() {
        visor.value = "0";
        primeiroNumero = null;
        operacao = null;
        novoNumero = true;
    }

    function apagar() {
        if (novoNumero || visor.value === "Erro") {
            visor.value = "0";
            novoNumero = true;
            return;
        }

        visor.value = visor.value.slice(0, -1);

        if (visor.value === "" || visor.value === "-") {
            visor.value = "0";
            novoNumero = true;
        }
    }

    function areaQuadrado() {
        const lado = Number(visor.value);
        const resultado = lado * lado;

        visor.value = String(resultado);
        novoNumero = true;
        operacao = null;
    }

    function areaTriangulo() {
        const base = Number(visor.value);
        const entrada = prompt("Digite a altura do triângulo:");

        if (entrada === null || entrada.trim() === "") return;

        const altura = Number(entrada);

        if (!Number.isFinite(altura)) {
            alert("Digite uma altura válida.");
            return;
        }

        const resultado = (base * altura) / 2;

        visor.value = String(resultado);
        novoNumero = true;
        operacao = null;
    }
</script>

</body>
</html>
